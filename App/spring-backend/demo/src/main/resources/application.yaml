spring:
  application:
    name: demo
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

groq:
  api:
    key: ${GROQ_API_KEY}

aws:
  s3:
    bucket-name: reddit-clone-deltaspace-eu
    region: eu-central-1
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET}
